<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
  <main class="hero">
    <header class="logo-container">
        <img src="image/logo.png" alt="Arcade logo" width="100px" height="100px">
        <h1><span style="color: rgb(178, 21, 21);">Arcade <br> Car</span></h1>
        <button class="back-btn">Back</button>
    </header>
    <div class="hero-image">
        <img src="image/amg1.jpg" alt="Mercedes AMG G63" width="600px" height="400px">
        <img src="image/range rover.jpg" alt="Range Rover" width="600px" height="400px">
        <img src="image/defender.avif" alt="Land Rover Defender" width="600px" height="400px">
        <img src="image/Thar-IMG_1.webp" alt="Mahindra Thar" width="600px" height="400px">
    </div>
    <div class="hero-discription">
        <h2>Welcome to Arcade Car!</h2>
       <p> Arcade car is a platfrom in which you can find <i>luxury</i> and <e>premium</e> <b>off Road</b> monsters vehicles</p>
    </div>
    <div class="hero-button">
        <button class="explore-btn">Explore</button>
    </div>
    <section class="hero-section">
        <h2>Range Rover</h2>
        <img src="image/range rover.jpg" alt="Range Rover" width="250px" height="170px"><br>
        <button class="range-btn">Buy</button>
    </section>
    <section class="hero-section-1">
        <h2>Mercedes AMG G63</h2>
        <img src="image/amg1.jpg" alt="Mercedes AMG G63" width="250px" height="170px"><br>
        <button class="amg-btn">Buy</button>
    </section>
    <section class="hero-section-2">
        <h2>Land Rover Defender</h2>
        <img src="image/defender.avif" alt="Land Rover Defender" width="250px" height="170px"><br>
        <button class="defender-btn">Buy</button>
    </section>
    <section class="hero-section-3">
        <h2>Mahindra Thar</h2>
        <img src="image/Thar-IMG_1.webp" alt="Mahindra Thar" width="250px" height="170px"><br>
        <button class="thar-btn">Buy</button>
    </section>
    <section class="hero-section-4">
        <h2>Jeep Wrangler</h2>
        <img src="image/jeep wrangler.avif" alt="Jeep Wrangler" width="250px" height="170px"><br>
        <button class="wrangler-btn">Buy</button>
    </section>
    <section class="hero-section-5">
        <h2>Jeep Compass</h2>
        <img src="image/Amg2.jpg" alt="AMG G63 6x6" width="250px" height="170px"><br>
        <button class="compass-btn">Buy</button>
    </section>
    <section class="hero-section-6">
        <h2>Jeep Grand Cherokee</h2>
        <img src="image/images.jpg" alt="Jeep Grand Cherokee" width="250px" height="170px"><br>
        <button class="grand-btn">Buy</button>
    </section>
    <p class="thanks">Thank for buying car from Arcade Car!</p>
  </main>
</body>
</html>
