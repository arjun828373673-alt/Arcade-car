<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
  <main class="hero">
    <header class="logo-container">
        <img src="image/logo.png" alt="Arcade logo" width="100px" height="100px">
        <h1><span style="color: rgb(178, 21, 21);">Arcade Car</span></h1>
    </header>
    <div class="hero-image">
        <img src="image/amg1.jpg" alt="Mercedes AMG G63" width="100%" height="auto">
        <img src="image/range rover.jpg" alt="Range Rover" width="100%" height="auto">
        <img src="image/defender.avif" alt="Land Rover Defender" width="100%" height="auto">
        <img src="image/Thar-IMG_1.webp" alt="Mahindra Thar" width="100%" height="auto">
    </div>
    <div class="hero-discription">
        <h2>Welcome to Arcade Car!</h2>
       <p> Arcade car is a platfrom in which you can find <i>luxury</i> and <e>premium</e> <b>off Road</b> monsters vehicles</p>
    </div>
    <div class="hero-button">
        <button type="button" class="btn" id="explore-btn">Explore</button>
    </div>
    <section class="hero-section" id="car-section">
        <h2>Range Rover</h2>
        <img src="image/range rover.jpg" alt="Range Rover" width="250px" height="170px"><br>
        <button type="button" class="btn" id="range-btn">Buy</button>
    </section>
    <section class="hero-section" id="car-section1">
        <h2>Mercedes AMG G63</h2>
        <img src="image/amg1.jpg" alt="Mercedes AMG G63" width="250px" height="170px"><br>
        <button type="button" class="btn" id="amg-btn">Buy</button>
    </section>
    <section class="hero-section" id="car-section2">
        <h2>Land Rover Defender</h2>
        <img src="image/defender.avif" alt="Land Rover Defender" width="250px" height="170px"><br>
        <button type="button" class="btn" id="defender-btn">Buy</button>
    </section>
    <section class="hero-section" id="car-section3">
        <h2>Mahindra Thar</h2>
        <img src="image/Thar-IMG_1.webp" alt="Mahindra Thar" width="250px" height="170px"><br>
        <button type="button" class="btn" id="thar-btn">Buy</button>
    </section>
    <section class="hero-section" id="car-section4">
        <h2>Jeep Wrangler</h2>
        <img src="image/jeep wrangler.avif" alt="Jeep Wrangler" width="250px" height="170px"><br>
        <button type="button" class="btn" id="wrangler-btn">Buy</button>
    </section>
    <section class="hero-section" id="car-section5">
        <h2>Jeep Compass</h2>
        <img src="image/Amg2.jpg" alt="AMG G63 6x6" width="250px" height="170px"><br>
        <button type="button" class="btn" id="compass-btn">Buy</button>
    </section>
    <section class="hero-section" id="car-section6">
        <h2>Jeep Grand Cherokee</h2>
        <img src="image/images.jpg" alt="Jeep Grand Cherokee" width="250px" height="170px"><br>
        <button type="button" class="btn" id="grand-btn">Buy</button>
    </section>
    <p class="thanks">Thank for buying car from Arcade Car!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
